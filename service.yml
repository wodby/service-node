endpoints:
- name: node
  ports:
  - name: node
    number: 3000
    main: true
    protocol: http

env:
- name: NODE_PORT
  value: '3000'
- name: NODE_ENV
  value: production
  envType: prod
- name: NODE_ENV
  value: development
  envType: dev
- name: NODE_ENV
  value: production
  envType: staging
- name: NODE_ENV
  value: production
  envType: test
- name: NODE_ENV
  value: production
  envType: feature

links:
- name: db
  title: DBMS
  required: false
  env:
  - name: DB_HOST
    value: '{{link.database.host}}'
  - name: DB_PORT
    value: '{{link.database.port}}'
  - name: DB_USERNAME
    value: '{{link.database.user.name}}'
  - name: DB_NAME
    value: '{{link.database.db.name}}'
  - name: DB_DATABASE
    value: '{{link.database.db.name}}'
  - name: DB_PASSWORD
    value: '{{link.database.user.password}}'
    secret: true
  - name: DB_DRIVER
    value: '{{link.database.driver}}'
  - name: DB_CONNECTION
    value: '{{link.database.driver}}'
  selectors:
  - type: db
    labels:
    - mariadb
  - type: db
    labels:
    - mysql
  - type: db
    labels:
    - postgres
- name: sendmail
  title: Mail Transfer Agent
  required: false
  env:
  - name: SMTP_HOST
    value: '{{link.host}}'
  - name: SMTP_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - smtpd
- name: redis
  title: Redis
  required: false
  env:
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey
- name: otel
  title: OpenTelemetry Collector
  required: false
  env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: 'http://{{link.host}}:{{link.port}}'
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_EXPORTER_OTLP_HEADERS
    value: 'Authorization=Bearer%20{{link.tokens.ingest_token}}'
    secret: true
  selectors:
  - type: service
    labels:
    - otlp

build:
  dockerfile: Dockerfile
  connect: true
  boilerplates:
  - name: expressjs
    title: Express.js boilerplate
    repo: https://github.com/wodby/expressjs-boilerplate
    branch: main

deployment:
  strategy: rolling
  maxUnavailable: 0
  maxSurge: 1
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/node
  chart: oci://registry-1.docker.io/wodby/node
  version: 0.3.2
  valueMappings:
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: node
    image: wodby/node
    resources:
      request:
        cpu: 10
        memory: 160
    build: true
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts

# Project package scripts select the development server; the image handles managers.
workspace:
  runner:
    workload: main
    container: node
    workingDirectory: /usr/src/app
    homeDirectory: /home/node
    username: node
    uid: 1000
    gid: 1000
    port: 2222
    command: [sudo, /usr/sbin/sshd, -D, -e, -f, /dev/null]
  mounts:
  - name: code
    workload: main
    container: node
    path: /usr/src/app
  preparation:
  - name: dependencies
    command: [workspace-node, prepare]
    timeoutSeconds: 1800
  # Keeps installed packages out of Git status. pnpm puts its store at the root
  # of the checkout's volume because the home is on another one.
  ignore: ['node_modules/', '/.pnpm-store/']
  # A dev script watches the files itself; for a start script, workspace-node
  # watches the checkout and restarts the application when a file changes.
  reload: watch
